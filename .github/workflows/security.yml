name: Verify private simulation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Scan Git history for credentials
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:105ac66a57b2bb8afb61a3b8a5dcc4817773d03724a7e8a515214cfe58225556 git /repo --redact --no-banner
      - name: Install test and security tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          .venv/bin/python -m pip install -e . --no-deps
          .venv/bin/python -m pip install pip-audit==2.10.1 cryptography==50.0.2
      - name: Audit pinned runtime dependencies
        run: .venv/bin/pip-audit -r requirements.lock --require-hashes --disable-pip
      - name: Backend and security regressions
        run: |
          .venv/bin/python -m pytest
          .venv/bin/python scripts/check-browser-parity.py --check
      - name: Deployment navigation regressions
        run: node --test tests/deployment/navigation.test.mjs
      - name: Frontend verification
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Verify public browser demo
        working-directory: frontend
        run: npm run test:e2e:demo
      - name: Build deployable images
        if: ${{ !cancelled() }}
        run: |
          mkdir -p /tmp/opencode
          .venv/bin/python scripts/test-deployment.py --build-only
      - name: Verify private HTTPS/SSO deployment
        run: .venv/bin/python scripts/test-deployment.py --skip-build
      - name: Gate deployable images on high/critical advisories
        if: ${{ !cancelled() }}
        run: .venv/bin/python scripts/scan-images.py
      # Never publish browser traces, inputs, cookies, secrets, or private images.
