[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.2.0"
description = "An interactive prompt-injection and file-access simulation lab"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.143.0,<1", "uvicorn>=0.54.0,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28.1,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
